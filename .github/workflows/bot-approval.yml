name: bot-approval

# Reusable human-triggered approval. Call this from a consumer repository:
#
# on:
#   pull_request:
#     types: [labeled]
# jobs:
#   approve:
#     uses: MaineCyberTech/ai-reviewer/.github/workflows/bot-approval.yml@REPLACE_WITH_AI_REVIEWER_SHA
#
# A maintainer applies the `bot-approve` label after reviewing. The workflow
# verifies the advisory AI review and required checks, then submits an approval
# with the caller repository's GITHUB_TOKEN.
on:
  workflow_call:
    inputs:
      label:
        description: Label that triggers approval
        required: false
        type: string
        default: bot-approve
      runs-on:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  approve:
    if: >-
      ${{
        github.event.label.name == inputs.label &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.sender.type == 'User' &&
        github.event.pull_request.user.login != 'github-actions[bot]'
      }}
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify checks and AI review, then approve
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          # Resolve the commit that would be approved. A review from an
          # earlier push must never satisfy the gate for a newer head.
          HEAD_SHA="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          HEAD_SHA="${HEAD_SHA,,}"
          if [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve the current head commit for PR #$PR (got '${HEAD_SHA:-<empty>}'); refusing to approve." >&2
            exit 1
          fi

          # ai-review writes a hidden marker into its comment:
          #   <!-- ai-review-head: <sha> -->
          # Require the marker for the current head. Legacy comments without
          # the marker are treated as stale rather than silently accepted.
          current_comment=''
          current_review=''

          comments="$(gh api "repos/$REPO/issues/$PR/comments" --paginate)"
          ai_comments="$(jq -s '
            map(if type == "array" then . else [] end) | add // []
            | map(select(.user.login == "github-actions[bot]"
                         and (.body | type == "string")
                         and (.body | contains("AI review (advisory)"))))
          ' <<<"$comments")"
          ai_comment_count="$(jq 'length' <<<"$ai_comments")"
          if [ "$ai_comment_count" -gt 0 ]; then
            marker="<!-- ai-review-head: ${HEAD_SHA} -->"
            current_comment="$(jq -r --arg marker "$marker" \
              '[.[] | select(.body | contains($marker)) | .id] | .[0] // empty' \
              <<<"$ai_comments")"
          fi

          # Also accept an advisory AI review submitted as a PR review, but
          # only when the API reports that review on the current head commit.
          if [ -z "$current_comment" ]; then
            reviews="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate)"
            current_review="$(jq -s --arg sha "$HEAD_SHA" '
              map(if type == "array" then . else [] end) | add // []
              | [.[] | select(.user.login == "github-actions[bot]"
                              and .commit_id == $sha
                              and (.body | type == "string")
                              and (.body | contains("AI review (advisory)")))
                 | .id] | .[0] // empty
            ' <<<"$reviews")"
          fi

          if [ -z "$current_comment" ] && [ -z "$current_review" ]; then
            if [ "$ai_comment_count" -eq 0 ]; then
              echo "No advisory AI review comment found; refusing to approve." >&2
            else
              echo "Stale advisory AI review: no AI review covers the current head commit ${HEAD_SHA}; refusing to approve. Re-run the AI review for this commit before applying bot-approve." >&2
            fi
            exit 1
          fi

          # Fail closed. A failed, empty or malformed `gh pr checks` query must
          # never be interpreted as "no pending checks". Exit 8 means checks are
          # pending; every other non-zero exit is a hard refusal.
          CHECKS_JSON=''
          CHECKS_PENDING=0
          query_required_checks() {
            local output rc err
            CHECKS_JSON=''
            CHECKS_PENDING=0
            err="$(mktemp)"
            set +e
            output="$(gh pr checks "$PR" --required --json name,state 2>"$err")"
            rc=$?
            set -e

            if [ "$rc" -ne 0 ] && [ "$rc" -ne 8 ]; then
              if grep -qi 'no required checks' "$err"; then
                echo "No required checks are configured; refusing to approve without verified required checks." >&2
              elif [ -n "$output" ] && jq -e 'type == "array" and length > 0' >/dev/null 2>&1 <<<"$output"; then
                echo "Required checks are not all green (gh exit $rc); refusing to approve." >&2
                jq -r '.[] | "\(.name): \(.state)"' <<<"$output" >&2 || true
              else
                echo "Failed to query required checks (gh exit $rc); refusing to approve." >&2
              fi
              if [ -s "$err" ]; then sed 's/^/  /' "$err" >&2; fi
              rm -f "$err"
              return 1
            fi

            if [ -z "$output" ] || ! jq -e 'type == "array" and length > 0' >/dev/null 2>&1 <<<"$output"; then
              echo "Required-check query returned no usable JSON (gh exit $rc); refusing to approve." >&2
              if [ -s "$err" ]; then sed 's/^/  /' "$err" >&2; fi
              rm -f "$err"
              return 1
            fi

            if [ "$rc" -eq 8 ]; then
              CHECKS_PENDING=1
            fi
            CHECKS_JSON="$output"
            rm -f "$err"
            return 0
          }

          for _ in $(seq 1 60); do
            if ! query_required_checks; then
              exit 1
            fi
            checks="$CHECKS_JSON"
            failed="$(jq '[.[] | select(.state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")] | length' <<<"$checks")"
            pending="$(jq '[.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .state == "EXPECTED")] | length' <<<"$checks")"
            if [ "$failed" -gt 0 ]; then
              echo "Required checks are failing; refusing to approve." >&2
              jq -r '.[] | "\(.name): \(.state)"' <<<"$checks" >&2
              exit 1
            fi
            if [ "$pending" -eq 0 ] && [ "$CHECKS_PENDING" -eq 0 ]; then
              break
            fi
            sleep 20
          done

          if ! query_required_checks; then
            exit 1
          fi
          checks="$CHECKS_JSON"
          failed="$(jq '[.[] | select(.state == "FAILURE" or .state == "CANCELLED" or .state == "TIMED_OUT" or .state == "ACTION_REQUIRED")] | length' <<<"$checks")"
          pending="$(jq '[.[] | select(.state == "PENDING" or .state == "QUEUED" or .state == "IN_PROGRESS" or .state == "EXPECTED")] | length' <<<"$checks")"
          if [ "$failed" -gt 0 ]; then
            echo "Required checks are failing; refusing to approve." >&2
            jq -r '.[] | "\(.name): \(.state)"' <<<"$checks" >&2
            exit 1
          fi
          if [ "$pending" -gt 0 ] || [ "$CHECKS_PENDING" -ne 0 ]; then
            echo "Required checks did not finish in time; refusing to approve." >&2
            exit 1
          fi

          gh api -X POST "repos/$REPO/pulls/$PR/reviews" \
            -f event=APPROVE \
            -f body="Automated approval: the \`bot-approve\` label was applied by a maintainer, the advisory AI review is present, and all required checks are green."
