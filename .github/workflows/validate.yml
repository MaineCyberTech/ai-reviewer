name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    # Fork PRs must never execute on the persistent self-hosted lab runner.
    # Same-repo PRs and main keep the existing lab runner.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","lab","lab-python"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Syntax
        run: |
          python3 -m py_compile .github/scripts/ai_review.py proxy/proxy.py scripts/validate.py scripts/test_workflows.py
          python3 scripts/validate.py
      - name: Workflow regression tests
        run: python3 scripts/test_workflows.py
