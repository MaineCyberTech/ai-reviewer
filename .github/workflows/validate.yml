name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Linux, X64, lab, lab-docker, ci-runner]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Syntax
        run: |
          python3 -m py_compile .github/scripts/ai_review.py proxy/proxy.py scripts/validate.py scripts/test_workflows.py
          python3 scripts/validate.py
      - name: Workflow regression tests
        run: python3 scripts/test_workflows.py
