name: ai-review

# Reusable advisory AI review. Call this from a consumer repository:
#
# jobs:
#   review:
#     uses: MaineCyberTech/ai-reviewer/.github/workflows/ai-review.yml@REPLACE_WITH_AI_REVIEWER_SHA
#     with:
#       pr: ${{ inputs.pr || 0 }}
#     secrets:
#       AI_REVIEW_ENDPOINT: ${{ secrets.AI_REVIEW_ENDPOINT }}
#       AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
#       AI_REVIEW_MODEL: ${{ secrets.AI_REVIEW_MODEL }}
#
# Pin `uses:` to a full 40-character commit SHA. The reviewer checkout below
# defaults to job.workflow_sha, the commit that defines this reusable workflow,
# so the code executed is the same immutable revision the caller pinned.
on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number, or 0 to use the current pull_request event
        required: false
        type: number
        default: 0
      model:
        description: Optional model override
        required: false
        type: string
        default: ""
      runs-on:
        description: JSON array of runner labels
        required: false
        type: string
        default: '["ubuntu-latest"]'
      reviewer_ref:
        description: >-
          Optional full 40-character commit SHA of MaineCyberTech/ai-reviewer
          to execute. Empty means the commit that defines this reusable
          workflow (job.workflow_sha).
        required: false
        type: string
        default: ""
    secrets:
      # Optional so Dependabot and fork PRs can run this workflow and skip
      # cleanly: those events do not receive repository Actions secrets, and a
      # missing secret must not turn the advisory review into a red check.
      AI_REVIEW_ENDPOINT:
        required: false
      AI_REVIEW_API_KEY:
        required: false
      AI_REVIEW_MODEL:
        required: false

permissions:
  contents: read
  pull-requests: write

# Serialize reviews within a repository. The GPU endpoint can still be busy
# from another repository; the client retries 429/5xx/524 with backoff.
concurrency:
  group: ai-review-${{ github.repository }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      ${{
        inputs.pr != 0 ||
        (github.event.pull_request.draft == false &&
         github.event.pull_request.head.repo.full_name == github.repository)
      }}
    # Defense in depth for callers that opt into a self-hosted runner: a fork
    # PR is always routed to GitHub-hosted ubuntu-latest, never to the lab.
    # Same-repo callers keep the runner requested through `runs-on`.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || fromJSON(inputs.runs-on) }}
    timeout-minutes: 20
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve reviewer commit
        id: reviewer-ref
        env:
          INPUT_REF: ${{ inputs.reviewer_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -Eeuo pipefail
          reviewer_ref="${INPUT_REF:-$WORKFLOW_SHA}"
          reviewer_ref="${reviewer_ref,,}"
          if [[ ! "$reviewer_ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reviewer_ref must resolve to a full 40-character commit SHA (got '${reviewer_ref:-<empty>}'); refusing to execute mutable reviewer code." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$reviewer_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout the reviewer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MaineCyberTech/ai-reviewer
          ref: ${{ steps.reviewer-ref.outputs.sha }}
          path: .ai-reviewer
          fetch-depth: 1
          persist-credentials: false

      - name: Verify reviewer checkout
        env:
          EXPECTED_SHA: ${{ steps.reviewer-ref.outputs.sha }}
        run: |
          set -Eeuo pipefail
          actual_sha="$(git -C .ai-reviewer rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Reviewer checkout resolved to $actual_sha, expected $EXPECTED_SHA; refusing to execute mutable reviewer code." >&2
            exit 1
          fi

      - name: Review the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
          AI_REVIEW_ENDPOINT: ${{ secrets.AI_REVIEW_ENDPOINT }}
          AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
          AI_REVIEW_MODEL: ${{ inputs.model || secrets.AI_REVIEW_MODEL || 'qwen2.5-coder:3b' }}
        run: |
          set -Eeuo pipefail

          # Dependabot-triggered runs and PRs from forks do not receive
          # repository Actions secrets. The review is advisory, so an empty
          # endpoint/key is a successful skip, not a failed check.
          if [ -z "${AI_REVIEW_ENDPOINT:-}" ] || [ -z "${AI_REVIEW_API_KEY:-}" ]; then
            echo "::notice title=AI review skipped::AI_REVIEW_ENDPOINT or AI_REVIEW_API_KEY is not available for this event (Dependabot PR or fork). The advisory AI review was skipped; no review comment was posted and nothing was approved."
            exit 0
          fi

          mkdir -p .ai-review

          # Tie the comment to the exact commit that was reviewed so bot
          # approval can reject a review left over from an earlier push.
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          head_sha="${head_sha,,}"
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve the PR head commit (got '${head_sha:-<empty>}'); refusing to post a review that cannot be tied to a commit." >&2
            exit 1
          fi

          gh pr view "$PR_NUMBER" --json title,body,files > .ai-review/pr.json
          gh pr diff "$PR_NUMBER" > .ai-review/pr.diff

          python3 .ai-reviewer/.github/scripts/ai_review.py \
            "$AI_REVIEW_MODEL" \
            .ai-reviewer/.github/prompts/ai-review.md \
            .ai-review/pr.json \
            .ai-review/pr.diff > .ai-review/review.md

          {
            printf '## AI review (advisory)\n\n'
            printf '<!-- ai-review-head: %s -->\n' "$head_sha"
            printf 'Reviewed head commit: `%s`\n\n' "$head_sha"
            printf '_Independent AI review of this diff. This is not a GitHub approval; a human must review and approve._\n\n'
            cat .ai-review/review.md
          } > .ai-review/comment.md

          gh pr comment "$PR_NUMBER" --body-file .ai-review/comment.md
